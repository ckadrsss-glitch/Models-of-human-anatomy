<!doctype html><html><head><meta charset="utf-8"><title>Morph debug</title>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
<style>body{margin:0;background:#000}canvas{display:block}</style></head><body>
<script type="module">
// debug.html?s=REF&box=-20,120,-140,20 — renders one calibrated state with a mm grid and the constructed landmarks
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { loadSkullGeometry, createSkull } from './src/skull.js';
import { ceph } from './src/morph.js';
import { STATES } from './src/states.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1000), H = +(q.get('h') || 1100);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); document.body.appendChild(r.domElement);
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x0a0f18);
sc.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-300, 200, 180); sc.add(key);
const g = await loadSkullGeometry(); const sk = createSkull(g); sc.add(sk.group);
const P = STATES[q.get('s') || 'REF']; sk.set(P);
const [z0, z1, y0, y1] = (q.get('box') || '-20,120,-140,20').split(',').map(Number);
const cam = new THREE.OrthographicCamera(z0, z1, y1, y0, 1, 2000); cam.position.set(-600, 0, 0); cam.up.set(0, 1, 0); cam.lookAt(0, 0, 0);
r.render(sc, cam);
const c2 = document.createElement('canvas'); c2.width = W; c2.height = H; c2.style.cssText = 'position:absolute;left:0;top:0'; document.body.appendChild(c2);
const x = c2.getContext('2d'); const px = (z) => (z - z0) / (z1 - z0) * W, py = (y) => (y1 - y) / (y1 - y0) * H;
for (let z = Math.ceil(z0 / 10) * 10; z <= z1; z += 10) { x.strokeStyle = 'rgba(0,255,255,.15)'; x.beginPath(); x.moveTo(px(z), 0); x.lineTo(px(z), H); x.stroke(); }
for (let y = Math.ceil(y0 / 10) * 10; y <= y1; y += 10) { x.strokeStyle = 'rgba(255,255,0,.15)'; x.beginPath(); x.moveTo(0, py(y)); x.lineTo(W, py(y)); x.stroke(); }
const c = ceph(P);
const pl = (pts, col) => { x.strokeStyle = col; x.lineWidth = 1.5; x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(px(p[0]), py(p[1])) : x.moveTo(px(p[0]), py(p[1]))); x.stroke(); };
pl(c.post, '#f0f'); pl(c.inf, '#0f0'); pl(c.ant, '#0ff'); pl(c.base, '#ff0');
pl([c.N, c.S, c.Ar, c.Go, c.Me], '#fff');
x.font = '14px sans-serif';
for (const k of ['S', 'N', 'Ar', 'Go', 'Me', 'Pog', 'X']) { const p = c[k]; x.fillStyle = '#f44'; x.beginPath(); x.arc(px(p[0]), py(p[1]), 4, 0, 7); x.fill(); x.fillText(k, px(p[0]) + 6, py(p[1]) - 6); }
x.fillStyle = '#fff'; x.fillText(`${q.get('s') || 'REF'}  saddle ${c.saddle.toFixed(1)} art ${c.articular.toFixed(1)} gon ${c.gonial.toFixed(1)}  ratio ${c.ratio.toFixed(1)}  GoMe ${c.GoMe.toFixed(1)}`, 10, 20);
window.ready = true;
</script></body></html>
