<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CK BIOMECHANICS — бренд-пакет</title>
<style>
  @font-face { font-family: Montserrat; src: url(assets/fonts/montserrat-latin.woff2) format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; background: #02060d; color: #fff; font-family: Montserrat, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 16px; }
  canvas { height: calc(100vh - 90px); max-width: 100%; aspect-ratio: 9/16; border-radius: 10px; }
  button { background: #0a1834; color: #fff; border: 1px solid #1d3361; border-radius: 8px; padding: 8px 14px; font: 600 13px Montserrat, sans-serif; cursor: pointer; }
  body.render { padding: 0; } body.render canvas { height: 1920px; width: 1080px; border-radius: 0; } body.render .ui { display: none; }
</style>
</head>
<body>
  <canvas id="c" width="1080" height="1920"></canvas>
  <div class="ui"><button id="replay">↺ Повторить концовку</button></div>
<script type="module">
  // Standalone preview / export of the universal CK BIOMECHANICS outro (src/brand.js)
  import { BRAND, backgroundCanvas, drawLogo, drawOutro } from './src/brand.js';
  const params = new URLSearchParams(location.search);
  if (params.has('render')) document.body.classList.add('render');
  await document.fonts.load('700 60px Montserrat'); await document.fonts.load('600 60px Montserrat');
  const c = document.getElementById('c'), ctx = c.getContext('2d');
  // u: seconds into the outro. The "content" here is just the background (no model).
  function frame(u) { ctx.drawImage(backgroundCanvas(), 0, 0); drawOutro(ctx, u); }
  function logoOnly() { ctx.clearRect(0, 0, 1080, 1920); drawLogo(ctx, 540, 1920 * 0.455); }
  window.BRANDKIT = { frame, logoOnly, bg: () => { ctx.drawImage(backgroundCanvas(), 0, 0); },
    grab: (t = 'image/png') => c.toDataURL(t), duration: BRAND.outroDuration };
  window.ready = true;
  let t0 = performance.now();
  document.getElementById('replay').onclick = () => (t0 = performance.now());
  if (!params.has('render')) (function loop() { frame(Math.min(BRAND.outroDuration, (performance.now() - t0) / 1000)); requestAnimationFrame(loop); })();
</script>
</body>
</html>
