<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CK BIOMECHANICS — Прикус и дыхание</title>
<style>
  @font-face { font-family: Montserrat; src: url(assets/fonts/montserrat-cyrillic.woff2) format('woff2'); font-weight: 100 900; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Montserrat; src: url(assets/fonts/montserrat-latin.woff2) format('woff2'); font-weight: 100 900; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  :root { --bg: #030a1c; --panel: #0a1834; --line: #1d3361; --text: #e9f1ff; --muted: #8ea3c8; --teal: #2de2d0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Montserrat, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 16px; }
  #stage { position: relative; aspect-ratio: 9 / 16; height: calc(100vh - 150px); max-width: 100%; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; letter-spacing: 3px; }
  .bar { width: min(760px, 100%); display: flex; align-items: center; gap: 10px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font: 600 13px Montserrat, sans-serif; cursor: pointer; }
  button:hover { border-color: var(--teal); }
  button:disabled { opacity: .45; cursor: default; }
  #scrub { flex: 1; accent-color: var(--teal); }
  #time { font: 600 13px ui-monospace, monospace; color: var(--muted); min-width: 92px; text-align: right; }
  .scenes { width: min(760px, 100%); display: flex; flex-wrap: wrap; gap: 6px; }
  .scenes button { padding: 5px 9px; font-size: 11px; font-weight: 500; }
  #status { font-size: 12px; color: var(--muted); min-height: 16px; }
  body.render { padding: 0; }
  body.render #stage { height: 1920px; width: 1080px; border-radius: 0; box-shadow: none; }
  body.render .ui { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/", "mp4-muxer": "./vendor/mp4-muxer/mp4-muxer.mjs" } }
</script>
</head>
<body>
  <div id="stage">
    <canvas id="gl" width="1080" height="1920"></canvas>
    <canvas id="ov" width="1080" height="1920"></canvas>
    <div id="loading">ЗАГРУЗКА АНАТОМИИ…</div>
  </div>
  <div class="bar ui">
    <button id="play" disabled>▶︎ Пуск</button>
    <input id="scrub" type="range" min="0" max="69" step="0.0333" value="0">
    <span id="time">0:00.0 / 1:09</span>
    <button id="mute">🔊</button>
  </div>
  <div class="scenes ui" id="scenes"></div>
  <div class="bar ui">
    <button id="exportMp4" disabled title="Покадровый рендер через WebCodecs, 1080×1920, 30 fps, ≤25 МБ">Экспорт MP4</button>
    <button id="exportWebm" disabled title="Запись в реальном времени (MediaRecorder)">Запись WebM</button>
    <span id="status"></span>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
