<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CK BIOMECHANICS — Space Creation & Anterior Retraction</title>
<meta name="description" content="3D-анимация: последовательная дистализация боковых зубов, создание пространства и контролируемая ретракция фронта. Без удаления зубов. CK BIOMECHANICS">
<meta name="theme-color" content="#02060d">
<link rel="icon" href="assets/brand/ck_logo_transparent.png" type="image/png">
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }</script>
<style>
  @font-face { font-family: Montserrat; src: url(assets/fonts/montserrat-latin.woff2) format('woff2'); font-weight: 100 900; font-display: block; }
  @font-face { font-family: Montserrat; src: url(assets/fonts/montserrat-cyrillic-wght-normal.woff2) format('woff2'); font-weight: 100 900; font-display: block; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116, U+2192; }
  :root { --bg: #02060d; --panel: #0a1834; --line: #1d3361; --accent: #2de2d0; --text: #eaf1ff; --muted: #8fa3c7; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Montserrat, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); -webkit-tap-highlight-color: transparent; }
  #player { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
  #stage { height: min(calc(100vh - 190px), calc((100vw - 32px) * 16 / 9)); aspect-ratio: 9 / 16; max-width: 100%; position: relative; }
  @supports (height: 100dvh) { #stage { height: min(calc(100dvh - 190px), calc((100vw - 32px) * 16 / 9)); } }
  #stage canvas { width: 100%; height: 100%; display: block; border-radius: 12px; box-shadow: 0 0 0 1px #13213d, 0 20px 60px rgba(0,0,0,.5); cursor: pointer; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; letter-spacing: 3px; color: var(--muted); text-align: center; padding: 20px; }
  .ui { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; width: min(100%, 720px); }
  button, label.btn { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font: 600 13px Montserrat, sans-serif; cursor: pointer; touch-action: manipulation; }
  button:hover, label.btn:hover { border-color: var(--accent); }
  button.on { border-color: var(--accent); color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  label.btn input { display: none; }
  .ic { width: 42px; height: 38px; padding: 0; display: grid; place-items: center; }
  .ic svg { width: 20px; height: 20px; fill: currentColor; }
  #play { background: var(--accent); color: #03101f; border-color: var(--accent); }
  #scrub { flex: 1; min-width: 140px; accent-color: var(--accent); height: 28px; }
  #time { font: 500 13px ui-monospace, monospace; color: #a9b8d6; min-width: 112px; text-align: center; }
  #status { font-size: 12px; color: var(--muted); min-height: 16px; text-align: center; }
  #scenes button { font-weight: 500; font-size: 12px; padding: 5px 9px; }
  @media (max-width: 600px) {
    body { padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); }
    #stage { height: auto; width: 100%; }
    button, label.btn { padding: 8px 9px; font-size: 12px; }
    #scenes, .export { display: none; }
  }
  /* fullscreen: video fills the screen, controls overlay at the bottom */
  #player:fullscreen, body.pseudo-fs #player { background: #000; justify-content: center; height: 100vh; padding: 0; }
  #player:-webkit-full-screen { background: #000; justify-content: center; height: 100vh; }
  #player:fullscreen #stage, body.pseudo-fs #stage { height: min(100vh - 64px, 100vw * 16 / 9); }
  body.pseudo-fs #player { position: fixed; inset: 0; z-index: 10; }
  #player:fullscreen #scenes, #player:fullscreen .export, body.pseudo-fs #scenes, body.pseudo-fs .export, body.pseudo-fs #status { display: none; }
  body.render { padding: 0; } body.render #stage { height: 1920px; width: 1080px; } body.render #stage canvas { border-radius: 0; box-shadow: none; } body.render .ui, body.render #status { display: none; }
</style>
</head>
<body>
  <div id="player">
    <div id="stage"><div id="loading">ЗАГРУЗКА 3D-АНАТОМИИ…</div></div>
    <div class="ui">
      <button id="play" class="ic" aria-label="Воспроизвести" title="Play / Pause (пробел)"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></button>
      <button id="restart" class="ic" aria-label="С начала" title="С начала"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
      <input id="scrub" type="range" min="0" max="1000" step="0.1" value="0" aria-label="Перемотка">
      <span id="time">00:00.0 / 00:55.0</span>
      <button id="fs" class="ic" aria-label="Полноэкранный режим" title="Полный экран (F)"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></button>
    </div>
    <div class="ui">
      <button id="sound">🔇 Звук</button>
      <button id="subs">💬 Субтитры</button>
      <label class="btn export">♪ Импорт аудио<input id="audioFile" type="file" accept="audio/*"></label>
      <button id="rec" class="export">● Запись WebM</button>
      <button id="mp4" class="export">⬇ Экспорт MP4</button>
    </div>
    <div class="ui" id="scenes"></div>
    <div id="status"></div>
  </div>
  <audio id="audio" src="assets/audio/mix.m4a" preload="auto" muted></audio>
  <script type="module" src="src/main.js"></script>
</body>
</html>
